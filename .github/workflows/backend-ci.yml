name: backend-ci

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  APP_ENV: test
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint (ruff + black)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ matrix.python-version }}-${{ hashFiles('backend/pyproject.toml', 'backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-${{ matrix.python-version }}-

      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.5,<1.0" "black>=24.0,<25.0"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Black check
        run: black --check .

  test:
    name: test (pytest + alembic upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carelink
          POSTGRES_PASSWORD: carelink
          POSTGRES_DB: carelink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carelink -d carelink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://carelink:carelink@localhost:5432/carelink_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://carelink:carelink@localhost:5432/carelink_test
      # Hard-coded CI-only dummy. Do NOT reference repo secrets here:
      # PR jobs from forks would otherwise be denied access (failing the run),
      # and same-repo PRs could exfiltrate the secret via test code.
      JWT_SECRET: "ci-only-dummy-jwt-secret-32chars-min"
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-${{ hashFiles('backend/pyproject.toml', 'backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-${{ matrix.python-version }}-

      - name: Install backend (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U carelink -d carelink_test >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            echo "waiting for postgres ($i)"; sleep 2
          done
          echo "postgres not ready"; exit 1

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Run pytest
        run: pytest

  migration-smoke:
    name: migration-smoke (upgrade -> downgrade -> upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carelink
          POSTGRES_PASSWORD: carelink
          POSTGRES_DB: carelink_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carelink -d carelink_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://carelink:carelink@localhost:5432/carelink_smoke
      ALEMBIC_DATABASE_URL: postgresql+psycopg://carelink:carelink@localhost:5432/carelink_smoke
      # Hard-coded CI-only dummy. See comment in `test` job above for rationale.
      JWT_SECRET: "ci-only-dummy-jwt-secret-32chars-min"
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-smoke-${{ matrix.python-version }}-${{ hashFiles('backend/pyproject.toml', 'backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-smoke-${{ matrix.python-version }}-

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U carelink -d carelink_smoke >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            echo "waiting for postgres ($i)"; sleep 2
          done
          echo "postgres not ready"; exit 1

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Alembic downgrade base
        run: alembic downgrade base

      - name: Alembic upgrade head (re-apply)
        run: alembic upgrade head
