# CareLink log rotation policy (Wave 5-B).
#
# Install (manual, see runbook Phase 5):
#   sudo ln -sf /opt/carelink/docs/deployment/scripts/logrotate-carelink.conf \
#               /etc/logrotate.d/carelink
#   sudo logrotate -d /etc/logrotate.d/carelink   # dry-run to validate
#
# logrotate is run nightly by /etc/cron.daily/logrotate on Debian/Ubuntu.
# These two log files are produced by:
#   - healthcheck-carelink.sh -> /var/log/carelink/healthcheck.log (every 5 min)
#   - backup-carelink-db.sh   -> /var/log/carelink/backup.log      (daily 02:30)

/var/log/carelink/healthcheck.log {
    weekly
    rotate 4
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root root
    # Scripts append to the log via shell redirection; copytruncate avoids a
    # missed-write window without requiring scripts to reopen the file.
    copytruncate
}

/var/log/carelink/backup.log {
    monthly
    rotate 3
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root root
    copytruncate
}
