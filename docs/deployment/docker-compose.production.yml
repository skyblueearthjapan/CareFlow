# CareLink production stack (Hostinger Malaysia VPS).
#
# 利用方針 (重要):
#   - 本ファイルは **リポジトリルートから直接 -f で参照** する。
#     例) docker compose -f docs/deployment/docker-compose.production.yml up -d
#     ※ 旧 runbook の `cp docker-compose.production.yml docker-compose.yml` は廃止。
#   - 環境変数は **/opt/carelink/.env (= リポジトリルートの .env)** に統合する。
#     compose は実行ディレクトリ (= リポジトリルート) の `.env` を自動ロードする。
#     env_file: で各 service にも明示的に注入し、interpolate と env_file の双方を成立させる。
#   - 全ポートは 127.0.0.1 (loopback) bind。外部公開は cloudflared が担当。
#   - kaipoke-api と同居するため `default bridge` のみを使用 (kaipoke-net は存在しない)。
#   - postgres は **host port を一切公開しない** (kaipoke-api との 5432 衝突回避)。
#     host から psql する場合は `docker compose exec postgres psql -U carelink -d carelink` を使う。
#   - frontend は Dockerfile が整備済み。standalone 出力 + pnpm multi-stage build。
#
# build context / env_file パスは **本ファイル (docs/deployment/) からの相対** で書く。
# Compose 仕様では build context と env_file は compose file の場所を基準に
# 解決されるため (cwd ではない)、`../../backend` `../../frontend` `../../.env`
# の形でリポジトリルートを参照する。

services:
  postgres:
    image: postgres:16-alpine
    container_name: carelink-postgres
    restart: unless-stopped
    env_file:
      # NOTE: env_file path is resolved relative to **this compose file**
      # (docs/deployment/), not the CWD. The runbook places the unified .env at
      # repo root (= /opt/carelink/.env), so we walk up two levels.
      - ../../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-carelink}
      TZ: Asia/Tokyo
    volumes:
      - carelink-pg-data:/var/lib/postgresql/data
    # NOTE: host port は意図的に公開しない (kaipoke-api 側 Postgres との 5432 衝突回避)。
    #       container 間通信は default bridge 経由で `postgres:5432` を使う。
    #       host から psql する場合は `docker compose exec postgres psql ...` を使うこと。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carelink} -d ${POSTGRES_DB:-carelink}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      # build context is resolved relative to **this compose file**
      # (docs/deployment/), so walk up two levels to reach <repo-root>/backend.
      context: ../../backend
      dockerfile: Dockerfile
    image: carelink-backend:latest
    container_name: carelink-backend
    restart: unless-stopped
    env_file:
      # NOTE: env_file path is resolved relative to **this compose file**
      # (docs/deployment/), not the CWD. The runbook places the unified .env at
      # repo root (= /opt/carelink/.env), so we walk up two levels.
      - ../../.env
    environment:
      # Override DATABASE_URL so it points at the compose service name
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-carelink}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-carelink}
      APP_ENV: production
    ports:
      - "127.0.0.1:18001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3); sys.exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      # See backend build context note above re: relative-to-compose-file resolution.
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        # GIT_SHA is injected into sw.js CACHE_VERSION at build time so that
        # service worker caches are invalidated per release. Set via deployment
        # script (`GIT_SHA=$(git rev-parse HEAD) docker compose ... build`).
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: carelink-frontend
    restart: unless-stopped
    env_file:
      # NOTE: env_file path is resolved relative to **this compose file**
      # (docs/deployment/), not the CWD. The runbook places the unified .env at
      # repo root (= /opt/carelink/.env), so we walk up two levels.
      - ../../.env
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - BACKEND_API_BASE_URL=${BACKEND_API_BASE_URL:-http://backend:8000}
    ports:
      - "127.0.0.1:18000:3000"
    healthcheck:
      # NOTE: BusyBox wget の `localhost` は IPv6 [::1] に解決されるが、
      #       Next.js standalone server は 0.0.0.0 (IPv4 のみ) で listen するため
      #       `http://localhost:3000/` だと Connection refused で 277 連続失敗していた。
      #       明示的に 127.0.0.1 を指定し、軽量な /api/healthz を叩く。
      test: ["CMD-SHELL", "wget -q -t1 --spider http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - default

volumes:
  carelink-pg-data:
    name: carelink-pg-data

# default bridge (`bridge`) を暗黙利用。`kaipoke-net` は VPS 上に存在しないため
# 明示 networks 定義はしない。kaipoke-api コンテナとは host loopback 経由で通信する。
