<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>取消・変更の記録 試案</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<style>
/* らく助のトークン (frontend/styles/tokens.css・dashboard-staff-performance-mock.html と同じ) */
:root{
  --brand:#e15a7f; --brand-hover:#c94a6e; --brand-light:#ffd6e0; --brand-50:#fff5f8;
  --bg-base:#fff; --bg-app:#faf7f2; --bg-muted:#f5f1ea;
  --line:#e7e5e4; --line-strong:#d6d3d1;
  --ink:#1c1917; --ink2:#57534e; --ink3:#a8a29e;
  --warn-bg:#fef3c7; --warn-strong:#92400e; --warn-line:#fde68a;
  --s1:#2a78d6; --s1-soft:#cde2fb;
  /* 種類の色 (緑は「良い」と読まれるので使わない) */
  --k-cancel:#b42318; --k-cancel-bg:#fdecea;
  --k-staff:#2a78d6;  --k-staff-bg:#e6f0fc;
  --k-move:#4a3aa7;   --k-move-bg:#eeebfa;
  --k-take:#57534e;   --k-take-bg:#f1efeb;
  --sans:'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',system-ui,sans-serif;
  --serif:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;
}
html{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-app);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;overflow-x:hidden}
button,select,textarea,input{font-family:var(--sans)}
button{cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ━━━ モックの帯 ━━━ */
.mockbar{background:#1c1917;color:#f5f1ea;font-size:12.5px;padding:8px 16px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.mockbar b{color:#ffd6e0}
.sw{display:inline-flex;flex-wrap:wrap;border:1px solid #78716c;border-radius:8px;overflow:hidden}
.sw button{border:none;background:#292524;color:#d6d3d1;padding:6px 12px;font-size:13px;border-right:1px solid #78716c}
.sw button:last-child{border-right:none}
.sw button.on{background:var(--brand);color:#fff;font-weight:700}

.page{padding:18px 16px 48px;display:flex;flex-direction:column;gap:14px;max-width:1500px;margin:0 auto}
@media(min-width:760px){.page{padding:18px 22px 48px}}
.ttl{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.ttl h1{font-family:var(--serif);font-size:22px;margin:0}
.ttl p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}
.who{margin-left:auto;font-size:12.5px;color:var(--ink2);background:var(--bg-base);border:1px solid var(--line);border-radius:999px;padding:3px 12px;white-space:nowrap}
@media(max-width:640px){.who{display:none}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg-base)}
.seg button{border:none;background:var(--bg-base);color:var(--ink2);padding:6px 12px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--brand);color:#fff;font-weight:700}
.lbl{font-size:12px;color:var(--ink2)}
.card{background:var(--bg-base);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(28,25,23,.04),0 8px 24px rgba(28,25,23,.05)}
.notice{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-strong);border-radius:8px;padding:9px 12px;font-size:13px}
.notice b{font-weight:700}
.hint{font-size:12.5px;color:var(--ink2)}
.newmark{display:inline-block;font-size:10.5px;font-weight:700;color:var(--brand-hover);background:var(--brand-50);border:1px solid var(--brand-light);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px;line-height:1.6}
.tg{font-size:10.5px;border-radius:999px;padding:0 7px;line-height:1.7;background:var(--bg-muted);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.tags{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}

/* ━━━ ① 盤面 ━━━ */
.boardhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line)}
.boardhead h2{font-size:16px;margin:0}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0}
.day{padding:10px 12px 14px;border-right:1px solid var(--line);min-height:220px;transition:background .12s}
.day:last-child{border-right:none}
@media(max-width:700px){.day{border-right:none;border-bottom:1px solid var(--line);min-height:0}.day:last-child{border-bottom:none}}
.day h3{font-size:13.5px;margin:0 0 8px;color:var(--ink2);font-weight:500}
.day.over{background:var(--brand-50);outline:2px dashed var(--brand);outline-offset:-6px}
.vc{position:relative;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:4px solid var(--s1);border-radius:8px;background:var(--bg-base);padding:9px 8px 9px 10px;margin-bottom:8px;cursor:grab;user-select:none}
.vc:active{cursor:grabbing}
.vc.dragging{opacity:.4}
.vc .t{font-weight:700;font-size:14px;min-width:44px}
.vc .p{font-size:14px;font-weight:500}
.vc .m{font-size:12px;color:var(--ink2)}
.vc .grow{flex:1;min-width:0}
.vc.cx{border-left-color:var(--k-cancel);background:#fcfaf9;cursor:default}
.vc.cx .p,.vc.cx .t{text-decoration:line-through;color:var(--ink3)}
.vc .badge{font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;line-height:1.7;white-space:nowrap}
.vc .menu-btn{border:1px solid var(--line);background:var(--bg-base);border-radius:8px;width:36px;height:36px;font-size:18px;line-height:1;color:var(--ink2);flex:none}
.vc .menu-btn:hover{border-color:var(--brand-light);color:var(--brand-hover)}
.pop{position:absolute;right:6px;top:44px;z-index:20;background:#fff;border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 30px rgba(28,25,23,.16);padding:6px;min-width:200px}
.pop button{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 12px;font-size:14px;border-radius:6px;color:var(--ink)}
.pop button:hover{background:var(--brand-50)}
.pop small{display:block;font-size:11.5px;color:var(--ink2)}
.quick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--bg-base);color:var(--ink);border-radius:8px;height:38px;padding:0 14px;font-size:14px}
.btn:hover{border-color:var(--brand-light)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--brand-hover)}
.btn.primary:disabled{background:#efc3d0;border-color:#efc3d0;cursor:not-allowed}
.btn.sm{height:32px;font-size:13px;padding:0 10px}

/* ━━━ 理由ダイアログ (add-visit-anywhere §3-5: 本文 14・小見出し 16・タイトル 18・入力 36〜40) ━━━ */
.back{position:fixed;inset:0;z-index:40;background:rgba(28,25,23,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.back.anim{animation:fade .14s ease-out}
.dlg{background:#fff;border-radius:12px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(28,25,23,.3)}
.back.anim .dlg{animation:rise .18s ease-out}
.dlg header{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dlg header h2{font-size:18px;margin:0}
.dlg header p{margin:4px 0 0;font-size:13px;color:var(--ink2)}
.dlg .body{padding:14px 20px 6px;overflow:auto}
.dlg footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dlg footer .why{font-size:12.5px;color:var(--ink2);margin-right:auto}
.sum{background:var(--bg-muted);border-radius:8px;padding:10px 12px;font-size:14px}
.sum b{font-size:15px}
.chg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px}
.chg .from{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3)}
.chg .arrow{color:var(--ink3)}
.chg .to{font-weight:700;color:var(--k-move)}
.sec{margin-top:16px}
.sec>h3{font-size:16px;margin:0 0 6px;display:flex;align-items:baseline;gap:8px}
.req{font-size:11px;font-weight:700;color:#fff;background:var(--brand);border-radius:4px;padding:0 6px;line-height:1.7}
.opt{font-size:11px;color:var(--ink2);border:1px solid var(--line-strong);border-radius:4px;padding:0 6px;line-height:1.6}
.field{display:flex;flex-direction:column;gap:4px}
select.in,textarea.in{border:1px solid var(--line-strong);border-radius:8px;font-size:14px;padding:0 10px;height:40px;background:#fff;color:var(--ink);width:100%}
textarea.in{height:auto;min-height:72px;padding:8px 10px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.grp{margin-top:8px}
.grp h4{font-size:12.5px;color:var(--ink2);font-weight:500;margin:0 0 4px}
.ropts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:6px}
.ropt{display:flex;align-items:center;gap:8px;min-height:40px;border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;background:#fff;transition:border-color .1s,background .1s}
.ropt:hover{border-color:var(--brand-light)}
.ropt input{accent-color:var(--brand);width:16px;height:16px;margin:0;flex:none}
.ropt.on{border-color:var(--brand);background:var(--brand-50);font-weight:700}
.ropt .addtag{font-size:10.5px;color:var(--brand-hover);font-weight:700}
.last{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin:2px 0 6px}
.last button{border:1px dashed var(--brand);color:var(--brand-hover);background:var(--brand-50);border-radius:999px;padding:2px 10px;font-size:12.5px}
.privacy{font-size:12px;color:var(--ink2);margin:4px 0 0}
.err{font-size:12.5px;color:var(--k-cancel)}

/* ━━━ トースト ━━━ */
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);z-index:60;background:#1c1917;color:#fff;border-radius:10px;padding:10px 12px 10px 16px;font-size:13.5px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;max-width:calc(100% - 32px);flex-wrap:wrap}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:1px solid #78716c;background:#292524;color:#ffd6e0;border-radius:6px;padding:4px 10px;font-size:13px}

/* ━━━ B ━━━ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi .k{font-size:12.5px;color:var(--ink2)}
.kpi .v{font-size:28px;font-weight:700;line-height:1.2;margin-top:2px}
.kpi .v small{font-size:14px;font-weight:500;color:var(--ink2);margin-left:3px}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:2px}
.kpi.new{border-color:var(--brand-light)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
.pc{padding:14px 16px;position:relative}
.pc:hover{border-color:var(--brand-light)}
.pc h3{margin:0;font-size:16px}
.pc .hit{position:absolute;inset:0;border:none;background:transparent;border-radius:10px;z-index:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tile .k{font-size:11.5px;color:var(--ink2)}
.tile .v{font-size:22px;font-weight:700;line-height:1.25}
.tile .v small{font-size:12px;font-weight:500;color:var(--ink2);margin-left:2px}
.tile .d{font-size:11.5px;color:var(--ink2)}
.chgbox{border:1px solid var(--brand-light);background:var(--brand-50);border-radius:8px;padding:8px 10px}
.chgbox .h{font-size:11.5px;color:var(--ink2);display:flex;align-items:center}
.chgnums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.cn .k{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.cn .k i{width:8px;height:8px;border-radius:2px;display:inline-block}
.cn .v{font-size:20px;font-weight:700;line-height:1.25}
.cn .v small{font-size:11.5px;font-weight:500;color:var(--ink2);margin-left:2px}
.cn .d{font-size:11px;color:var(--ink2)}
.chgbox .nr{font-size:11.5px;color:var(--ink2);margin-top:4px}
.zero{color:var(--ink3)}

/* ━━━ C ━━━ */
.people{display:flex;gap:6px;flex-wrap:wrap}
.people button{border:1px solid var(--line);background:var(--bg-base);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--ink2)}
.people button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.csum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:10px}
.csum .card{padding:10px 14px}
.csum .k{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.csum .k i{width:9px;height:9px;border-radius:2px;display:inline-block}
.csum .v{font-size:24px;font-weight:700}
.csum .v small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:2px}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer}
.chk input{accent-color:var(--brand);width:16px;height:16px}
.evhead,.evrow{display:grid;grid-template-columns:118px minmax(100px,.9fr) 92px minmax(150px,1.2fr) minmax(170px,1.5fr) minmax(130px,1fr) 104px 96px;gap:10px;align-items:start;padding:10px 14px}
.evhead{font-size:12px;color:var(--ink2);border-bottom:1px solid var(--line);padding-top:8px;padding-bottom:8px}
.evrow{border-bottom:1px solid var(--line);font-size:13.5px}
.evrow:last-child{border-bottom:none}
.evrow.undone{opacity:.55}
.evrow.undone .ba,.evrow.undone .pt{text-decoration:line-through}
.evrow.fresh{background:var(--brand-50);box-shadow:inset 3px 0 0 var(--brand)}
.evrow .sub{display:block;font-size:11.5px;color:var(--ink2)}
.kind{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:0 7px;line-height:1.8;white-space:nowrap}
.k-cancel{color:var(--k-cancel);background:var(--k-cancel-bg)}
.k-uncancel{color:var(--ink2);background:var(--bg-muted)}
.k-staff{color:var(--k-staff);background:var(--k-staff-bg)}
.k-move{color:var(--k-move);background:var(--k-move-bg)}
.k-take{color:var(--k-take);background:var(--k-take-bg);border:1px solid var(--line-strong)}
.norsn{display:inline-block;font-size:12px;color:var(--ink2);background:var(--bg-muted);border:1px dashed var(--line-strong);border-radius:4px;padding:0 7px;line-height:1.8}
.kprsn{color:var(--warn-strong)}
.org{display:inline-block;font-size:11.5px;border-radius:999px;padding:0 8px;line-height:1.8;white-space:nowrap;border:1px solid var(--line)}
.o-app{color:var(--brand-hover);background:var(--brand-50);border-color:var(--brand-light)}
.o-kaipoke{color:var(--warn-strong);background:var(--warn-bg);border-color:var(--warn-line)}
.o-status{color:var(--ink2);background:var(--bg-muted)}
.o-back{color:var(--ink2);background:#fff;border-style:dashed;border-color:var(--line-strong)}
.empty{padding:28px 14px;text-align:center;color:var(--ink2)}
.more{padding:10px 14px;text-align:center}
@media(max-width:900px){
  .evhead{display:none}
  .evrow{grid-template-columns:1fr auto;grid-template-areas:"dt kd" "pt pt" "ba ba" "rs rs" "op op" "og at";gap:4px 10px;padding:12px 14px}
  .evrow>.c-dt{grid-area:dt;font-weight:700}
  .evrow>.c-kd{grid-area:kd;justify-self:end}
  .evrow>.c-pt{grid-area:pt}
  .evrow>.c-ba{grid-area:ba}
  .evrow>.c-rs{grid-area:rs}
  .evrow>.c-op{grid-area:op;font-size:12.5px;color:var(--ink2)}
  .evrow>.c-og{grid-area:og}
  .evrow>.c-at{grid-area:at;justify-self:end;font-size:12px;color:var(--ink2)}
  .evrow>.c-op::before{content:'操作した人: '}
  .evrow>.c-at::before{content:'変更した日 '}
}

/* ━━━ ④ 理由の選択肢 ━━━ */
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px}
.lst{padding:12px 14px}
.lst h2{font-size:16px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.lst h2 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lst .cnt{font-size:12px;color:var(--ink2);font-weight:400}
.li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.li:last-child{border-bottom:none}
.li .nm{flex:1;min-width:0}
.li .was{display:block;font-size:11.5px;color:var(--ink2)}
.li.off .nm>span:first-child{text-decoration:line-through;color:var(--ink3)}
.li .mk{border:1px solid var(--line-strong);background:#fff;border-radius:6px;font-size:12px;padding:3px 8px;color:var(--ink2);white-space:nowrap}
.li.off .mk{border-color:var(--k-cancel);color:var(--k-cancel);background:var(--k-cancel-bg)}
.li .added{font-size:10.5px;font-weight:700;color:var(--brand-hover);background:var(--brand-50);border-radius:4px;padding:0 5px;margin-left:4px}
.addrow{display:flex;gap:6px;margin-top:10px}
.addrow input{flex:1;min-width:0;height:36px;border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;font-size:14px}
.addrow select{height:36px;border:1px solid var(--line-strong);border-radius:8px;font-size:13px;padding:0 6px;max-width:42%}
.box{padding:12px 16px;font-size:13.5px}
.box h2{font-size:13.5px;margin:0 0 6px;color:var(--brand-hover)}
.box ul{margin:0;padding-left:18px} .box li{margin-bottom:3px}
.explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px}
.settings-sketch{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.ss-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;font-size:13px}
.ss-row .grip{color:var(--ink3);letter-spacing:-2px}
.ss-row .act{margin-left:auto;display:flex;gap:6px;color:var(--ink2);font-size:12px}
.ss-row .act span{border:1px solid var(--line);border-radius:4px;padding:0 6px}
textarea.out{width:100%;min-height:140px;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:13px;font-family:var(--sans);margin-top:8px}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flash{from{background:var(--brand-light)}to{background:var(--brand-50)}}
.evrow.fresh{animation:flash 1.2s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="mockbar">
  <span><b>モック</b>　取消・変更の記録と理由（10/20 時点の想定・記録の開始日 10/6）。氏名はすべて架空です。</span>
  <span class="sw" id="view" role="tablist">
    <button data-v="board" class="on">① 盤面と理由の入力</button>
    <button data-v="B">② B 人ごとのカード</button>
    <button data-v="C">③ C 取消・変更の記録</button>

/* ━━━ 過去〜今の記録を作る (決まった種で毎回同じ) ━━━ */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SLOTS = ['09:00', '09:30', '10:00', '10:30', '11:00', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00'];

  return { cancel: cancel.size, change: change.size, staff: staffCh.size, move: move.size, take: take.size, noReason: noReason.size, kaipoke: kaipoke.size };

const staffShown = () => STAFF.filter(s => !S.office || s.off === S.office);

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

let D = null; // { kind, visit, toDay, toTime, newStaff, reasonId, text, fromDrop, lastFocus }
function findReason(kind, id) { for (const g of REASONS[kind]) for (const r of g.items) if (r.id === id) return r; return null; }
function openDialog(kind, visit, opt = {}) {

  setTimeout(() => { const f = document.querySelector('.dlg input[type=radio], .dlg select'); f && f.focus(); }, 30);

}
function dlgValid() {

  if (D.kind === 'staff_change' && !D.newStaff) return { ok: false, why: '新しい担当を選ぶと押せます' };
  if (D.kind === 'move' && D.toDay === D.visit.day && D.toTime === D.visit.t) return { ok: false, why: '移動先が今と同じです' };

}
function renderDialog(first = false) {
  const v = D.visit, d = BOARD_DAYS[v.day];
  const titles = { cancel: ['今週だけ取り消す', 'この週の、この訪問だけを取り消します。毎週の型は変わりません。', '取り消す'], staff_change: ['担当を変える', '今週のこの訪問だけ、担当を変えます。毎週の型は変わりません。', '担当を変える'], move: ['訪問を移動する', D.fromDrop ? 'ドロップした位置へ移動します。やめると元の場所に戻ります。' : '今週のこの訪問だけ、日と時刻を変えます。毎週の型は変わりません。', '移動する'] };
  const [title, lead, okLabel] = titles[D.kind];
  const sum = `<div class="sum"><b>${esc(v.p)} 様</b>　<span class="tnum">${md(d)} ${v.t}〜${endT(v.t, v.dur)}</span>　担当 ${esc(SN(v.staff))}
    ${D.kind === 'move' ? `<div class="chg"><span class="from tnum">${md(d)} ${v.t}</span><span class="arrow">→</span><span class="to tnum">${md(BOARD_DAYS[D.toDay])} ${D.toTime}</span></div>` : ''}
    ${D.kind === 'staff_change' && D.newStaff ? `<div class="chg"><span class="from">${esc(SN(v.staff))}</span><span class="arrow">→</span><span class="to" style="color:var(--k-staff)">${esc(SN(D.newStaff))}</span><span class="hint">（${esc(SN(D.newStaff))} さんに「引き受け」として数えます）</span></div>` : ''}</div>`;
  const extra = D.kind === 'staff_change'

function confirmDialog() {
  const v = D.visit, r = findReason(D.kind, D.reasonId), snap = { ...v };
  const ev = { id: ++EID, vkey: 'b-' + v.id, owner: v.staff, date: BOARD_DAYS[v.day], time: v.t, patient: v.p, kind: D.kind, origin: 'app', backfill: false, created: `${TODAY} ${new Date().toTimeString().slice(0, 5)}`, reason: r.label, reasonText: D.text.trim(), actor: ACTOR, undone: false, boardVid: v.id };

/* ━━━ トースト ━━━ */
let toastTimer;

  document.getElementById('toastAct').innerHTML = (undo ? '<button id="tUndo">戻る</button> ' : '') + '<button id="tGo">C で見る</button>';
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 7000);
  document.getElementById('tGo').onclick = () => { t.classList.remove('show'); S.view = 'C'; S.who = 's1'; S.period = 'oct'; render(); window.scrollTo({ top: 0 }); };

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function rowsFor(staffId) {

  for (const e of EVENTS) {
    if (e.date < p.from || e.date > p.to) continue;
    if (e.owner === staffId) rows.push({ e, role: 'owner' });
    else if (e.newStaff === staffId) rows.push({ e, role: 'take' });
  }
  return rows.filter(({ e, role }) => {
    if (e.undone && !S.showUndone) return false;
    if (S.noReason && (e.reason || e.reasonSys || e.oldText)) return false;
    if (S.fKind === 'take') { if (role !== 'take') return false; }

    return true;

  const op = !e.actor ? '<span class="hint">記録なし</span>'
    : e.origin === 'kaipoke' ? `<span class="sub" style="display:inline">取込を実行した人</span><br>${esc(e.actor)}`
    : e.origin === 'status' ? `<span class="sub" style="display:inline">ステータスを変えた人</span><br>${esc(e.actor)}`
    : `${esc(e.actor)}${isUser(e.actor) ? '' : '<span class="sub">ユーザー名（スタッフに紐づいていません）</span>'}`;
  const og = e.origin === 'kaipoke' ? '<span class="org o-kaipoke">カイポケ</span>' : e.origin === 'status' ? '<span class="org o-status">ステータス連動</span>' : '<span class="org o-app">らく助</span>';
  const back = e.backfill ? ' <span class="org o-back">以前の記録</span>' : '';
  const [cd, ct] = e.created.split(' ');
  return `<div class="evrow ${e.undone ? 'undone' : ''} ${FRESH.has(e.id) ? 'fresh' : ''}">
    <div class="c-dt tnum">${md(e.date)} ${e.time}${FRESH.has(e.id) ? ' <span class="newmark">いま記録</span>' : ''}</div>
    <div class="c-pt pt">${esc(maskName(e.patient))} 様${role === 'take' ? `<span class="sub">${esc(SN(e.owner))} さんから</span>` : ''}</div>
    <div class="c-kd">${kindTag}${e.undone ? `<span class="sub">戻した（${e.undoneAt ? e.undoneAt.slice(5).replace('-', '/') : '翌日'}）</span>` : ''}</div>
    <div class="c-ba ba">${ba}</div>
    <div class="c-rs">${rs}</div>
    <div class="c-op">${op}</div>
    <div class="c-og">${og}${back}</div>
    <div class="c-at tnum">${mdShort(cd)} ${ct}</div>
  </div>`;
}
function renderC() {
  const s = STAFF.find(x => x.id === S.who), c = counts(s.id), rows = rowsFor(s.id);
  const seg = (id, cur, opts) => `<div class="seg" id="${id}">${opts.map(([k, l]) => `<button data-f="${k}" class="${cur === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  return `${filterBar()}
    <div class="bar"><span class="lbl">職員</span><div class="people">${staffShown().map(p => `<button data-who="${p.id}" class="${p.id === S.who ? 'on' : ''}">${esc(p.n)}</button>`).join('')}</div></div>
    <p class="hint" style="margin:0">※ C の上半分（折れ線 4 枚・週ごとの表）は今のまま。ここではその下に足す「取消・変更の記録」だけを出しています。</p>
    <div class="csum">
      <div class="card"><div class="k"><i style="background:var(--k-cancel)"></i>取消</div><div class="v tnum">${c.cancel}<small>件</small></div></div>
      <div class="card"><div class="k"><i style="background:var(--k-staff)"></i>担当変更</div><div class="v tnum">${c.staff}<small>件</small></div></div>
      <div class="card"><div class="k"><i style="background:var(--k-move)"></i>移動</div><div class="v tnum">${c.move}<small>件</small></div></div>
      <div class="card"><div class="k"><i style="background:var(--k-take)"></i>引き受け</div><div class="v tnum">${c.take}<small>件</small></div></div>
      <div class="card"><div class="k">理由の記録なし</div><div class="v tnum">${c.noReason}<small>件</small></div></div>
    </div>
    ${partialNote(true)}
    <section class="card" aria-labelledby="clogH">
      <div class="boardhead"><h2 id="clogH">${esc(s.n)} の取消・変更の記録 <span class="newmark">追加</span></h2><span class="hint">${rows.length} 件（訪問日の新しい順）</span></div>
      <div class="filters">
        <span class="lbl">種類</span>${seg('fKind', S.fKind, [['all', 'すべて'], ['cancel', '取消'], ['staff_change', '担当変更'], ['move', '移動'], ['take', '引き受け']])}
        <span class="lbl">出所</span>${seg('fOrigin', S.fOrigin, [['all', 'すべて'], ['app', 'らく助'], ['kaipoke', 'カイポケ'], ['status', 'ステータス連動']])}
        <label class="chk"><input type="checkbox" id="fNoReason" ${S.noReason ? 'checked' : ''}>理由の記録なしだけ</label>
        <label class="chk"><input type="checkbox" id="fUndone" ${S.showUndone ? 'checked' : ''}>戻した操作も出す</label>
        <label class="chk"><input type="checkbox" id="fMask" ${S.mask ? 'checked' : ''}>利用者名を伏せる</label>
      </div>
      <div class="evhead"><span>訪問日</span><span>利用者</span><span>種類</span><span>変更前 → 変更後</span><span>理由</span><span>操作した人</span><span>出所</span><span>変更した日</span></div>
      ${rows.length ? rows.slice(0, S.limit).map(evRow).join('') : '<div class="empty">この条件の取消・変更はありません</div>'}
      ${rows.length > S.limit ? `<div class="more"><button class="btn sm" id="more">さらに ${Math.min(30, rows.length - S.limit)} 件を表示</button></div>` : ''}
    </section>
    <div class="explain">
      <div class="card box"><h2>この一覧の読み方</h2><ul>
        <li><b>操作した人</b>は、らく助にログインして操作した人です（スタッフに紐づいていなければユーザー名）。</li>
        <li><b>カイポケ</b>の行は、カイポケで変わったものを取り込んだ記録です。理由はカイポケ側にあり、「操作した人」は取込を実行した人です。</li>
        <li><b>以前の記録</b>は、記録の開始日より前の分を、残っていた控えから読み取ったものです。</li>
        <li><b>引き受け</b>は、ほかの人の訪問を担当変更で引き受けた行です（取消・変更の件数には入りません）。</li>
      </ul></div>
    </div>`;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ④ 理由の選択肢（確認用）
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function renderR() {
  const color = { cancel: 'var(--k-cancel)', staff_change: 'var(--k-staff)', move: 'var(--k-move)' };
  const lst = kind => {
    const n = REASONS[kind].reduce((a, g) => a + g.items.filter(r => !r.removed).length, 0);
    return `<section class="card lst" aria-label="${KIND_NAME[kind]}の理由"><h2><i style="background:${color[kind]}"></i>${KIND_NAME[kind]} <span class="cnt">${n} 個</span></h2>
      ${REASONS[kind].map((g, gi) => `<div class="grp"><h4>${esc(g.g)}</h4>${g.items.map(r => `<div class="li ${r.removed ? 'off' : ''}">
        <span class="nm"><span>${esc(r.label)}</span>${r.added ? '<span class="added">追加案</span>' : ''}${r.requiresText ? ' <span class="hint">（補足が必須）</span>' : ''}${r.was ? `<span class="was">たたき台: ${esc(r.was)}</span>` : ''}</span>
        <button class="mk" data-toggle="${r.id}" data-kind="${kind}" aria-pressed="${r.removed}">${r.removed ? '外す案 ✕' : '残す'}</button></div>`).join('')}</div>`).join('')}
      <form class="addrow" data-add="${kind}"><select aria-label="小見出し">${REASONS[kind].map((g, gi) => `<option value="${gi}">${esc(g.g)}</option>`).join('')}</select><input placeholder="追加したい理由" aria-label="${KIND_NAME[kind]}に追加したい理由" maxlength="40"><button class="btn sm" type="submit">追加</button></form>
    </section>`;
  };
  return `<div class="notice" style="background:var(--brand-50);border-color:var(--brand-light);color:var(--ink)"><b>PO 確認用</b>: 「残す」を押すと「外す案」になります。下の欄で追加の案も入れられます。<b>ここでの変更は ① のダイアログにもすぐ反映されます</b>（本番では <b>設定 → 取消・変更の理由</b> で同じことをします）。終わったら「確認結果を書き出す」で文字にして送ってください。</div>
    <div class="lists">${lst('cancel')}${lst('staff_change')}${lst('move')}</div>
    <div class="explain">
      <div class="card box"><h2>画面からは選べないシステムの理由</h2><ul>${SYSTEM_REASONS.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        <p class="hint" style="margin:6px 0 0">カイポケ取込・ステータス連動・🛌 休みにする・提案の適用のときに自動で入ります。名前だけ設定で変えられます。</p></div>
      <div class="card box"><h2>設定 → 取消・変更の理由（後の段階）</h2>
        <p style="margin:0">事業所ごとに言い方や必要な理由が違うので、コードには書かず設定で持ちます。管理者だけが変えられます。</p>
        <div class="settings-sketch" aria-hidden="true">
          <div class="ss-row"><span class="grip">⋮⋮</span>利用者の都合（外出・来客など）<span class="act"><span>名前</span><span>隠す</span></span></div>
          <div class="ss-row"><span class="grip">⋮⋮</span>家族の都合<span class="act"><span>名前</span><span>隠す</span></span></div>
          <div class="ss-row" style="color:var(--ink3)"><span class="grip">⋮⋮</span>（隠した理由）<span class="act"><span>戻す</span></span></div>
        </div>
        <ul style="margin-top:8px"><li>追加・名前を変える・並べ替え・小見出しを変える・隠す・「補足を必須にする」</li><li>使われた理由は削除できず、隠すだけ（過去の記録は書いたときの名前で出ます）</li></ul></div>
      <div class="card box"><h2>たたき台から変えた点</h2><ul>
        <li>「死亡」→「ご逝去」（画面に出る言葉なので丁寧に）</li>
        <li>「スタッフ急休」→「スタッフの急な休み」（略語を避け、🛌 休みにする の自動の理由と同じ言葉に）</li>
        <li>「スタッフの体調不良」→「体調不良・早退」（終日の休みと、出勤後の途中交代を分ける）</li>
        <li>「相性・NG」→「相性（NG スタッフを含む）」</li>
        <li>3 つの一覧で同じ意味の言葉はそろえた（後で理由別に集計できるように）</li>
      </ul></div>
    </div>
    <div class="card box"><h2>確認結果</h2><button class="btn" id="exportR">確認結果を書き出す</button><textarea class="out" id="outR" readonly placeholder="ここに文字で出ます（コピーして送れます）"></textarea></div>`;
}
function exportR() {
  const lines = ['理由の選択肢 確認結果'];
  for (const kind of ['cancel', 'staff_change', 'move']) {
    lines.push('', `■ ${KIND_NAME[kind]}`);
    for (const g of REASONS[kind]) for (const r of g.items) lines.push(`  ${r.removed ? '✕ 外す' : r.added ? '＋ 追加' : '○ 残す'}　[${g.g}] ${r.label}`);
  }
  const o = document.getElementById('outR'); o.value = lines.join('\n'); o.select();
  if (navigator.clipboard) navigator.clipboard.writeText(o.value).catch(() => { /* 書き出した欄からコピーしてもらう */ });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   描画とイベント
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const HEAD = {
  board: ['今週の運転席', '訪問を取り消す・担当を変える・移動するときに、理由を選びます。'],
  B: ['ダッシュボード', 'スタッフごとの訪問の実績に、取消・変更の件数を足します。'],
  C: ['ダッシュボード', '1 人を深く見る画面に、取消・変更を 1 件ずつ並べます。'],
  R: ['取消・変更の理由', '理由の選択肢を確認します（本番では 設定 → 取消・変更の理由）。'],
};
function render() {
  document.querySelectorAll('#view button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  document.getElementById('h1').textContent = HEAD[S.view][0];
  document.getElementById('h1p').textContent = HEAD[S.view][1];
  document.getElementById('main').innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">${S.view === 'board' ? renderBoard() : S.view === 'B' ? renderB() : S.view === 'C' ? renderC() : renderR()}</div>`;
}
document.getElementById('view').onclick = e => { const v = e.target.dataset.v; if (v) { S.view = v; S.menu = null; render(); } };
const main = document.getElementById('main');
main.addEventListener('click', e => {
  const t = e.target;
  const mb = t.closest('[data-menu]'); if (mb) { S.menu = S.menu === mb.dataset.menu ? null : mb.dataset.menu; render(); const p = document.querySelector('.pop button'); p && p.focus(); return; }
  const act = t.closest('[data-act]'); if (act) { const v = VISITS.find(x => x.id === act.dataset.vid); if (act.dataset.act === 'uncancel') uncancel(v); else openDialog(act.dataset.act, v); return; }
  const demo = t.closest('[data-demo]'); if (demo) {
    const k = demo.dataset.demo, v = VISITS.find(x => !x.cancelled && x.staff === 's1' && !x.moved) || VISITS.find(x => !x.cancelled);
    if (!v) { toast('取り消していない訪問がありません'); return; }
    openDialog(k, v, k === 'move' ? { toDay: (v.day + 1) % BOARD_DAYS.length, fromDrop: true } : {}); return;
  }
  const p = t.closest('#period button'); if (p) { S.period = p.dataset.p; S.limit = 30; render(); return; }
  const o = t.closest('#office button'); if (o) { S.office = o.dataset.o; if (S.office && STAFF.find(s => s.id === S.who).off !== S.office) S.who = staffShown()[0].id; render(); return; }
  const w = t.closest('[data-who]'); if (w) { S.who = w.dataset.who; S.view = 'C'; S.limit = 30; render(); if (w.classList.contains('hit')) window.scrollTo({ top: 0 }); return; }
  const fk = t.closest('#fKind button'); if (fk) { S.fKind = fk.dataset.f; render(); return; }
  const fo = t.closest('#fOrigin button'); if (fo) { S.fOrigin = fo.dataset.f; render(); return; }
  if (t.id === 'more') { S.limit += 30; render(); return; }
  const tg = t.closest('[data-toggle]'); if (tg) { const r = findReason(tg.dataset.kind, tg.dataset.toggle); r.removed = !r.removed; render(); return; }
  if (t.id === 'exportR') { exportR(); return; }
  if (S.menu && !t.closest('.pop')) { S.menu = null; render(); }
});
main.addEventListener('change', e => {
  if (e.target.id === 'fNoReason') { S.noReason = e.target.checked; render(); }
  if (e.target.id === 'fUndone') { S.showUndone = e.target.checked; render(); }
  if (e.target.id === 'fMask') { S.mask = e.target.checked; render(); }
});
main.addEventListener('submit', e => {
  const f = e.target.closest('[data-add]'); if (!f) return; e.preventDefault();
  const kind = f.dataset.add, label = f.querySelector('input').value.trim(), gi = +f.querySelector('select').value;
  if (!label) return;
  const r = mk(label); r.added = true; r.requiresText = false;
  const items = REASONS[kind][gi].items, oi = items.findIndex(x => x.label === 'その他');
  oi >= 0 ? items.splice(oi, 0, r) : items.push(r);
  render();
});
// 描画し直すと押した要素は DOM から外れるので、closest ではなく dispatch 時の経路で判定する。
document.addEventListener('click', e => { if (S.menu && !e.composedPath().includes(main)) { S.menu = null; render(); } });

render();
/* 確認用: #B #C #R で開く */
const H0 = location.hash.slice(1); if (['board', 'B', 'C', 'R'].includes(H0)) { S.view = H0; render(); }
</script>
</body>
</html>
