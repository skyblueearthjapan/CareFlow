<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>患者QR 印刷（個別＆一括・A5カード2面／A4） — モック</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --brand:#0d9488; --brand-accent:#14b8a6; --brand-hover:#0f766e; --brand-light:#ccfbf1;
    --cream:#faf7f2; --base:#ffffff; --ink:#1c1917; --sub:#57534e; --muted:#a8a29e; --border:#e7e2d9;
  }
  *{box-sizing:border-box}
  body{margin:0; background:#e9e6e0; color:var(--ink);
    font-family:"Noto Sans JP",-apple-system,"Hiragino Kaku Gothic ProN","Segoe UI",sans-serif; font-size:13px}

  /* ---- toolbar（画面のみ） ---- */
  .toolbar{position:sticky; top:0; z-index:10; background:var(--base); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:12px; padding:12px 22px; flex-wrap:wrap}
  .toolbar h1{font-size:16px; margin:0; font-weight:700}
  .toolbar .crumb{font-size:11.5px; color:var(--muted)}
  .sep{width:1px; height:30px; background:var(--border)}
  .spacer{flex:1}
  .seg{display:inline-flex; background:var(--cream); border:1px solid var(--border); border-radius:10px; padding:3px}
  .seg button{border:none; background:none; font-family:inherit; font-size:12.5px; padding:6px 13px; border-radius:8px; cursor:pointer; color:var(--sub)}
  .seg button.on{background:var(--base); color:var(--brand-hover); font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,.07)}
  .chip{border:1px solid var(--border); border-radius:99px; padding:6px 13px; font-size:12.5px; color:var(--sub); cursor:pointer; background:var(--base)}
  .chip.on{background:var(--brand-light); color:var(--brand-hover); border-color:transparent; font-weight:600}
  select{font-family:inherit; font-size:13px; padding:6px 10px; border:1px solid var(--border); border-radius:8px; background:var(--base)}
  .count{font-size:12.5px; color:var(--sub)}
  .btn{border:1px solid var(--border); background:var(--base); border-radius:9px; padding:8px 14px; font-family:inherit; font-size:13px; cursor:pointer; color:var(--sub); display:inline-flex; gap:6px; align-items:center}
  .btn.brand{background:var(--brand); color:#fff; border-color:var(--brand); font-weight:700}
  .hint{font-size:11.5px; color:var(--muted); padding:6px 22px 0; line-height:1.7}

  /* ---- A4：A5 横カード 2 面 ---- */
  .pages{padding:18px 0 40px}
  .sheet{position:relative; width:210mm; height:297mm; background:#fff; margin:0 auto 18px;
    box-shadow:0 6px 20px rgba(0,0,0,.14); display:flex; flex-direction:column}

  /* A5 横カード（210mm × 148.25mm）。切り取ってパウチする単位。 */
  .card{position:relative; flex:0 0 148.25mm; height:148.25mm; padding:9mm;
    display:flex; flex-direction:column; overflow:hidden}
  .card .body{flex:1; display:flex; gap:7mm; min-height:0}
  .chk{position:absolute; top:6px; right:10px; transform:scale(1.3); cursor:pointer; z-index:3}

  /* 左カラム：ロゴ／氏名／コード／拠点 … 下端に お問い合わせ先 */
  .col-left{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; align-items:flex-start}
  .logo{width:42mm; height:auto; display:block}
  .pname{font-size:28px; font-weight:800; margin:4mm 0 1mm; line-height:1.2}
  .pcode{font-size:12px; color:var(--muted); letter-spacing:.06em}
  .contactbox{margin-top:auto; align-self:stretch; background:var(--cream); border:1px solid var(--border); border-radius:10px; padding:4mm 5mm}
  .contactbox .h{font-size:12px; font-weight:700; color:var(--brand-hover); letter-spacing:.04em}
  .contactbox .tel{font-size:18px; font-weight:800; color:var(--ink); letter-spacing:.02em; line-height:1.35}
  .contactbox .row{font-size:12px; color:var(--sub); line-height:1.7}
  .contactbox .station{margin-top:1mm; font-size:12.5px; font-weight:700; color:var(--ink)}

  /* 右カラム：QR（62mm 角）と案内 1 行 */
  .col-right{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3mm}
  .qrbox{padding:4mm; border:1px solid var(--border); border-radius:12px; background:#fff}
  .qrbox img,.qrbox canvas{display:block; width:62mm !important; height:62mm !important}
  .lead{width:70mm; font-size:11.5px; color:var(--sub); line-height:1.6; text-align:center}

  .foot{display:flex; justify-content:space-between; align-items:flex-end; gap:6mm; font-size:10px; color:var(--muted); margin-top:3mm}

  /* 切り取り線：シートの物理的中央（top:50%）に固定。画面 148.5mm ／ 印刷 148.25mm
     （296.5 の半分）＝ A5 カードの境界とちょうど一致する。内容量に依存しない。 */
  .fold{position:absolute; left:10mm; right:10mm; top:50%; height:0; border-top:1.4px dashed #c9b8a0; z-index:2}
  .fold span{position:absolute; left:50%; top:-9px; transform:translateX(-50%); background:#fff; padding:0 10px;
    font-size:10px; color:#b08968; letter-spacing:.04em; white-space:nowrap}

  /* 一括：未選択患者のコンパクト行（画面のみ） */
  .selrow{display:flex; align-items:center; gap:12px; width:210mm; max-width:calc(100% - 24px);
    margin:0 auto 6px; padding:10px 16px; background:#fff; border:1px solid var(--border); border-radius:9px; cursor:pointer}
  .selrow .name{font-weight:700}
  .selrow .meta{font-size:12px; color:var(--muted); letter-spacing:.04em}

  /* ---- print ---- */
  @page{ size:A4; margin:0; }
  @media print{
    body{background:#fff}
    .toolbar,.hint,.selrow{display:none}
    .pages{padding:0}
    .sheet{margin:0; box-shadow:none; height:296.5mm; page-break-after:always; page-break-inside:avoid}
    .sheet:not(:has(~ .sheet)){page-break-after:auto}
    .chk{display:none}
  }
</style>
</head>
<body>

<div class="toolbar">
  <div>
    <div class="crumb" id="crumb"></div>
    <h1>患者QR 印刷</h1>
  </div>
  <span class="sep"></span>
  <div class="seg" id="modeSeg">
    <button data-mode="single" class="on">個別（患者詳細から1名）</button>
    <button data-mode="bulk">一括（一覧から全員）</button>
  </div>
  <span class="sep"></span>
  <span id="singleCtl">患者：<select id="patSel"></select></span>
  <span id="bulkCtl" hidden>
    <span class="chip on" data-office="all">全拠点</span>
    <span class="chip" data-office="稲毛">稲毛</span>
    <span class="chip" data-office="都賀">都賀</span>
  </span>
  <span class="spacer"></span>
  <span class="count" id="count"></span>
  <button class="btn" id="selAll" hidden>全選択</button>
  <button class="btn" id="selNone" hidden>全解除</button>
  <button class="btn brand" onclick="window.print()">🖨 印刷</button>
</div>
<div class="hint" id="hint"></div>

<div class="pages" id="pages"></div>

<script>
const PATIENTS=[
  {name:'山田 花子', code:'P095', office:'稲毛', token:'kf93Qa2LmX7tZ'},
  {name:'佐藤 一郎', code:'P096', office:'稲毛', token:'a8Lp02QmZ4kR'},
  {name:'鈴木 みどり', code:'P097', office:'稲毛', token:'Yt7vBn1cWq0e'},
  {name:'加藤 蓮', code:'P103', office:'都賀', token:'Qw4Er7Ty1Ui3'},
  {name:'吉田 千夏', code:'P104', office:'都賀', token:'As6Df9Gh2Jk5'},
];
const BASE='https://carelink.kaipoke-api.net/q/';
const ISSUED='2026-09-18';
/* モック単体で開けるよう、frontend/public/brand/ の SVG を同ディレクトリにコピーして参照する。
   ロゴを差し替えたら両方を更新すること。 */
const LOGO='yoriyori-logo-h.svg';

/* お問い合わせ先（本実装は frontend/lib/qr-print-contact.ts の 1 箇所で管理）。 */
const STATION_NAME='訪問看護ステーション よりより';
const STATION_TEL='043-215-8991';
const STATION_HOURS='9:00〜18:00';
const STATION_DAYS='日曜・年末年始休暇を除く';

const CARDS_PER_SHEET=2;
let mode='single';          // 'single'（患者詳細から1名） | 'bulk'（一覧から全員）
let office='all';
const selected=new Set(PATIENTS.map(p=>p.code));

function shown(){ return PATIENTS.filter(p=>office==='all'||p.office===office); }
function chunk(arr,size){ const out=[]; for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size)); return out; }

/* A5 横カード 1 面ぶんの HTML。氏名・QR・お問い合わせ先・ロゴをこの 1 面に収める。 */
function cardHTML(p, withChk){
  return `<div class="card" data-code="${p.code}">
    ${withChk?'<input type="checkbox" class="chk" checked>':''}
    <div class="body">
      <div class="col-left">
        <img class="logo" src="${LOGO}" alt="">
        <div class="pname">${p.name} 様</div>
        <div class="pcode">${p.code}</div>
        <div class="contactbox">
          <div class="h">お問い合わせ先</div>
          <div class="tel">TEL ${STATION_TEL}</div>
          <div class="row">対応時間 ${STATION_HOURS}</div>
          <div class="row">対応日 ${STATION_DAYS}</div>
          <div class="station">${STATION_NAME}</div>
        </div>
      </div>
      <div class="col-right">
        <div class="qrbox"><div class="qr"></div></div>
        <div class="lead">訪問のたびに、スタッフがこのQRコードを読み取って到着・退出を記録します</div>
      </div>
    </div>
    <div class="foot">
      <span>このQRにお名前・住所などの個人情報は含まれていません</span>
      <span>発行日 ${ISSUED}　/　${p.code}　/　QR v1</span>
    </div>
  </div>`;
}

/* A4 シート 1 枚 = A5 カード最大 2 面 + 物理中央の切り取り線。 */
function sheetEl(pair, withChk){
  const sheet=document.createElement('div');
  sheet.className='sheet';
  sheet.innerHTML=pair.map(p=>cardHTML(p, withChk)).join('')
    +'<div class="fold"><span>✂ ここで切り取り（A5・パウチ用）</span></div>';
  pair.forEach(p=>{
    const host=sheet.querySelector(`.card[data-code="${p.code}"] .qr`);
    new QRCode(host, { text:BASE+p.token, width:190, height:190,
      colorDark:'#1c1917', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M });
    const chk=sheet.querySelector(`.card[data-code="${p.code}"] .chk`);
    if(chk) chk.onchange=()=>{ selected.delete(p.code); render(); };
  });
  return sheet;
}

function selRowEl(p){
  const row=document.createElement('label');
  row.className='selrow';
  row.innerHTML=`<input type="checkbox"><span class="name">${p.name} 様</span><span class="meta">${p.code}・${p.office}</span>`;
  row.querySelector('input').onchange=()=>{ selected.add(p.code); render(); };
  return row;
}

function render(){
  const pages=document.getElementById('pages'); pages.innerHTML='';
  if(mode==='single'){
    const code=document.getElementById('patSel').value;
    const p=PATIENTS.find(x=>x.code===code);
    // 個別：シート 1 枚・上半分にカード 1 面（下半分は白紙・切り取り線は出す）。
    if(p) pages.appendChild(sheetEl([p], false));
  }else{
    const sh=shown();
    const on=sh.filter(p=>selected.has(p.code));
    const off=sh.filter(p=>!selected.has(p.code));
    // 一括：選択済みを 2 名ずつ 1 シートに詰め、未選択はコンパクト行で後ろへ。
    chunk(on, CARDS_PER_SHEET).forEach(pair=>pages.appendChild(sheetEl(pair, true)));
    off.forEach(p=>pages.appendChild(selRowEl(p)));
  }
  updateCount();
}

function updateCount(){
  const c=document.getElementById('count');
  if(mode==='single'){ c.textContent='印刷 1枚'; return; }
  const sh=shown(); const sel=sh.filter(p=>selected.has(p.code)).length;
  c.textContent=`表示 ${sh.length}名 / 印刷 ${sel}名（A4 ${Math.ceil(sel/CARDS_PER_SHEET)}枚）`;
}

function applyMode(){
  const single=mode==='single';
  document.getElementById('singleCtl').hidden=!single;
  document.getElementById('bulkCtl').hidden=single;
  document.getElementById('selAll').hidden=single;
  document.getElementById('selNone').hidden=single;
  document.getElementById('crumb').textContent=single?'患者マスタ › 患者詳細 › QR印刷':'患者マスタ › QR一括印刷';
  document.getElementById('hint').innerHTML=single
    ? '💡 <b>個別モード</b>：選んだ患者 1 名分を <b>A4 上半分の A5 カード 1 面</b> に印刷します（切り取ってパウチ）。'
    : '💡 <b>一括モード</b>：拠点で絞り込み、チェックで対象を選びます。<b>A4 1 枚に A5 カード 2 面（2 名分）</b> をまとめて印刷します。';
  render();
}

// 患者セレクト初期化
const sel=document.getElementById('patSel');
sel.innerHTML=PATIENTS.map(p=>`<option value="${p.code}">${p.name}（${p.code}・${p.office}）</option>`).join('');
sel.onchange=render;

document.getElementById('modeSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  mode=b.dataset.mode;
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b));
  applyMode();
};
document.querySelectorAll('.chip[data-office]').forEach(c=>c.onclick=()=>{
  office=c.dataset.office;
  document.querySelectorAll('.chip[data-office]').forEach(x=>x.classList.toggle('on',x===c));
  render();
});
document.getElementById('selAll').onclick=()=>{ shown().forEach(p=>selected.add(p.code)); render(); };
document.getElementById('selNone').onclick=()=>{ shown().forEach(p=>selected.delete(p.code)); render(); };

applyMode();
</script>
</body>
</html>
