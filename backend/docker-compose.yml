# Local development stack for CareLink backend.
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# Notes:
#   - `frontend/` lives in a sibling directory and is started separately.
#   - For prod the same backend image is used; only env vars and reverse proxy
#     differ (D5 owns docker-compose.prod.yml).
services:
  postgres:
    image: postgres:16-alpine
    container_name: carelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carelink
      POSTGRES_PASSWORD: carelink
      POSTGRES_DB: carelink
      TZ: Asia/Tokyo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carelink -d carelink"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carelink-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://carelink:carelink@postgres:5432/carelink
      # Wave 4-D: visit-photo storage path inside the container. Must
      # match the bind-mount target below. Override via .env if you want
      # the host directory layout.
      VISIT_PHOTOS_DIR: /opt/carelink/data/visit_photos
    volumes:
      # Wave 4-D: persist uploaded visit photos on the host so they
      # survive container rebuilds. Create ./data/visit_photos on the
      # host first; chown to the container's `app` UID if SELinux/UID
      # mapping bites.
      - ./data/visit_photos:/opt/carelink/data/visit_photos
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;r=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz',timeout=3);sys.exit(0 if r.status==200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    name: carelink_postgres_data
