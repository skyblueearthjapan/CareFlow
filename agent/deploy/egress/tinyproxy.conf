# carelink-agent-egress（箱の出口）。許可リストに無いホスト・443 以外の CONNECT は断る。
Port 3128
Listen 0.0.0.0
Timeout 900
MaxClients 16
# 箱の網（172.31.250.0/24 ほか、compose の AGENT_SANDBOX_SUBNET）からだけ受ける。網の外からは届かない作りだが念のため
Allow 172.16.0.0/12
Allow 10.0.0.0/8
Allow 127.0.0.1

# CONNECT は 443 だけ
ConnectPort 443

# ホスト名の許可リスト（拡張正規表現・大文字小文字を区別しない・既定は拒否）
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes

DisableViaHeader Yes
LogLevel Notice
PidFile "/tmp/tinyproxy.pid"
